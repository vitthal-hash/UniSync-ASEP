    :root {

      --primary-dark: #4f46e5;
      --secondary-color: #10b981;
      --accent-color: #f59e0b;
      --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --msg-bg: #ffffff;
      --msg-bg-other: #f1f5f9;
      --msg-border: #e2e8f0;
      --msg-text: #1e293b;
      --msg-time: #64748b;
      --online-green: #10b981;
      --offline-gray: #94a3b8;
      --danger-color: #ef4444;
      --warning-color: #f59e0b;
    }
    .light { --msg-bg: #ffffff; --msg-bg-other:#f8fafc; --msg-border:#e2e8f0; --msg-text:#0f172a; }
    body.dark { --msg-bg:#1e293b; --msg-bg-other:#334155; --msg-border:#475569; --msg-text:#f1f5f9; --msg-time:#cbd5e1; }
    * { transition: background-color .3s ease, border-color .3s ease; box-sizing: border-box; }

    .dashboard-container { display:flex; height:100vh; overflow:hidden; background:var(--bg-gradient); position:relative; }
    .dashboard-container::before { content:''; position:absolute; inset:0; background: url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover; opacity:.05; }
    /* Sidebar */
    .sidebar { width:280px; background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border-right:1px solid rgba(255,255,255,0.06); padding:1.5rem; display:flex; flex-direction:column; z-index:100; }
    .logo { display:flex; gap:12px; align-items:center; margin-bottom:2rem; font-size:1.8rem; font-weight:700; color:white; }
    .logo i { color:var(--primary-light); animation:spin 10s linear infinite; }
    @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
    .sidebar nav { display:flex; flex-direction:column; gap:0.5rem; flex:1; }
    .sidebar nav a { display:flex; align-items:center; gap:12px; padding:.9rem 1rem; color: rgba(255,255,255,.9); text-decoration:none; border-radius:12px; font-weight:500; }
    .sidebar nav a.active { background: rgba(255,255,255,0.12); box-shadow:0 4px 12px rgba(99,102,241,0.2); }
    .sidebar-footer { margin-top:auto; display:flex; flex-direction:column; gap:.75rem; }
    /* Chat main */
    .chat-main { flex:1; display:flex; flex-direction:column; background:var(--msg-bg); border-radius:24px 0 0 24px; overflow:hidden; position:relative; box-shadow:-20px 0 60px rgba(0,0,0,.3); }
    .chat-header { padding:1rem 1.5rem; border-bottom:1px solid var(--msg-border); display:flex; align-items:center; justify-content:space-between; background:var(--msg-bg); z-index:10; }
    .chat-info { display:flex; align-items:center; gap:1rem; }
    .chat-avatar { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-weight:600; font-size:1.2rem; background:var(--bg-gradient); box-shadow:0 4px 12px rgba(99,102,241,.4); animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
    .chat-details h2 { margin:0; font-size:1.3rem; color:var(--msg-text); font-weight:600; }
    .chat-details p { margin:0; font-size:.9rem; color:var(--msg-time); display:flex; align-items:center; gap:6px; }
    .online-dot { width:8px; height:8px; border-radius:50%; background:var(--online-green); display:inline-block; animation:blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.5} }
    .chat-actions { display:flex; gap:.75rem; }

    .chat-window { flex:1; overflow-y:auto; padding:1.5rem; display:flex; flex-direction:column; gap:1rem; background:linear-gradient(180deg,var(--msg-bg) 0%, var(--msg-bg-other) 100%); }
    .msg { max-width:70%; padding:1rem; border-radius:18px; position:relative; animation:slideIn .3s ease-out; box-shadow:0 2px 8px rgba(0,0,0,.1); border:1px solid var(--msg-border); overflow: visible;}
    @keyframes slideIn { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }
    /* Incoming messages — always dark readable text */
.msg:not(.mine) .msg-user,
.msg:not(.mine) .msg-text,
.msg:not(.mine) .msg-time {
    color: #000 !important;
}

    /* Outgoing (your messages) – WhatsApp style */
.msg.mine {
    background: #d9fdd3 !important;   /* WhatsApp green bubble */
    color: #000 !important;
    border: 1px solid #b4e8ab !important;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
}
.msg.mine .msg-user,
.msg.mine .msg-time {
    color: #000 !important;
}

    .msg-user { font-weight:600; font-size:.9rem; margin-bottom:.5rem; color:var(--msg-text); }

    .ticks { margin-left:.5rem; }

    .chat-input-area { padding:1rem 1.5rem; background:var(--msg-bg); border-top:1px solid var(--msg-border); display:flex; gap:.75rem; align-items:center; }

    .icon-btn { width:40px; height:40px; border-radius:50%; border:none; background:transparent; color:var(--msg-time); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .3s ease; }

    #sendBtn { background: linear-gradient(135deg,var(--primary-color),var(--primary-dark)); color:white; border:none; padding:.75rem 1.5rem; border-radius:24px; cursor:pointer; font-weight:600; display:flex; align-items:center; gap:.5rem; box-shadow:0 4px 12px rgba(99,102,241,.3); }

    .popup { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:1000; animation:fadeIn .3s ease; }

/* ===============================
   MESSAGE DROPDOWN CARET
   =============================== */

.msg {
  position: relative;
  overflow: visible;
}

/* container */
.msg-actions-caret {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
}

/* sent → left */
.message-row.mine .msg-actions-caret {
  left: -18px;
}

/* received → right */
.message-row:not(.mine) .msg-actions-caret {
  right: -18px;
}

/* caret icon */
.msg-caret {
  cursor: pointer;
  font-size: 14px;
  color: #6b7280; /* neutral gray */
  user-select: none;
}

.msg-caret:hover {
  color: #111827;
}



/* sent menu opens right */
.message-row.mine .msg-action-menu {
  left: 20px;
}

/* received menu opens left */
.message-row:not(.mine) .msg-action-menu {
  right: 20px;
}

.msg-action-menu.hidden {
  display: none;
}
.reaction-emoji,
.reply-btn,
.msg-caret {
  cursor: pointer;
}

.reaction-emoji:hover,
.reply-btn:hover {
  opacity: 0.8;
}
/* Reply button visibility fix */
.msg-action-menu .reply-btn {
  color: #111827;            /* dark text */
  font-weight: 600;
}

/* Explicit fix for received messages */
.message-row:not(.mine) .msg-action-menu .reply-btn {
  color: #111827;            /* force visible */
}

/* Hover feedback */
.msg-action-menu .reply-btn:hover {
  color: #2563eb;            /* blue on hover */
}
/* =========================
   REACTION COUNT VISIBILITY
   ========================= */

.reaction-summary {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  flex-wrap: wrap;
}

/* individual emoji count chip */
.reaction-summary span {
  background: #f1f5f9;      /* light gray */
  color: #111827;           /* dark text */
  font-size: 13px;
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 600;
  cursor: pointer;
}

/* sent messages (green bubble) */
.msg.mine .reaction-summary span {
  background: #c7f0c2;
  color: #000;
}

/* dark mode */
body.dark .reaction-summary span {
  background: #374151;
  color: #f9fafb;
}
.reaction-summary span {
  cursor: pointer;
}
/* ========
/* ===== DESKTOP SIDEBAR RESET (CRITICAL) ===== */
@media (min-width: 769px) {

  .sidebar {
    position: relative;
    left: 0;
    width: 260px;          /* keep your original width */
    height: auto;
    box-shadow: none;
  }

  body.sidebar-open {
    overflow: auto;
  }

}

@media (max-width: 768px) {

  /* Hide sidebar completely by default */
  .sidebar {
    position: fixed;
    left: -100%;
    top: 0;
    height: 100vh;
    width: 260px;
    background: #000;
    z-index: 2000;
    transition: left 0.3s ease;
  }

  /* Show sidebar when hamburger is clicked */
  .sidebar.open {
    left: 0;
  }

  /* Chat takes full screen */
  .chat-main {
    width: 100%;
    border-radius: 0;
  }

  /* Prevent horizontal scroll */
  body {
    overflow-x: hidden;
  }

  /* Message bubbles adapt better */
  .msg {
    max-width: 90%;
  }
}

    /* -------------------------
       Imports & constants
       ------------------------- */
    import { GroupsAPI, ChatAPI, AuthAPI } from "./assets/api.js";
    const API_BASE = "https://unisync-asep-production.up.railway.app/api";

    let selectedTarget = "all";

    /* -------------------------
       DOM references
       ------------------------- */
    const params = new URLSearchParams(window.location.search);
    const groupId = params.get("group");
    if (!groupId) { window.location.href = "groups.html"; }

    const chatWindow = document.getElementById("chatWindow");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const groupNameEl = document.getElementById("groupName");
    const onlineText = document.getElementById("onlineText");
    const groupAvatar = document.getElementById("groupAvatar");

    const membersPopup = document.getElementById("membersPopup");
    const membersList = document.getElementById("membersList");
    const previewPopup = document.getElementById("previewPopup");
    const previewContainer = document.getElementById("previewContainer");
    const closePreview = document.getElementById("closePreview");

    const mediaPopup = document.getElementById("mediaPopup");
    const closeMediaPopup = document.getElementById("closeMediaPopup");
    const emojiGrid = document.getElementById("emojiGrid");
    const gifResults = document.getElementById("gifResults");
    const stickerResults = document.getElementById("stickerResults");
    const emojiCategories = document.getElementById("emojiCategories");

    const msgFilterBtn = document.getElementById("msgFilterBtn");
    const msgFilterMenu = document.getElementById("msgFilterMenu");
const pollPopup = document.getElementById("pollPopup");
const createPollBtn = document.getElementById("createPollBtn");

    const user = JSON.parse(localStorage.getItem("unisync_user") || "{}");
    let readCounts = {};
    let totalMembers = 0;
    let initialLoad = true;
    let replyingTo = null;
let lastRenderedDateLabel = "";
let amIAdmin = false;
let adminOnlyChat = false;

    /* -------------------------
       Socket setup
       ------------------------- */
    const socket = io("https://unisync-asep-production.up.railway.app", {
  transports: ["websocket", "polling"]
});

    if (user && user.id) {
      socket.emit("user_online", { userId: user.id });
      socket.emit("register_user", user.id);
    }

    window.addEventListener("beforeunload", () => {
      if (user && user.id) socket.emit("user_offline", { userId: user.id });
      socket.disconnect();
    });

    // Typing indicator emit
    let typingTimeout;
    messageInput.addEventListener("input", () => {

function getDateLabel(dateStr) {
  const d = new Date(dateStr);
  const today = new Date();

  const d0 = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());

  const diffDays = (t0 - d0) / (1000 * 60 * 60 * 24);

  if (diffDays === 0) return "Today";
  if (diffDays === 1) return "Yesterday";

  return d.toLocaleDateString("en-GB", {
    day: "2-digit",
    month: "short",
    year: "numeric"
  });
}

        const rect = el.getBoundingClientRect();

    function updateAllMessageTicks() {

        if (!id) return;
        const tickEl = el.querySelector(".ticks");
        if (!tickEl) return;
        const readCount = readCounts[id] || 0;

        tickEl.innerText = readCount >= needed ? "✓✓" : "✓";

    async function fetchReadCounts() {

        const res = await fetch(`${API_BASE}/chat/${groupId}/reads`, { headers: { Authorization: "Bearer " + token }});
        const data = await res.json();
        if (!data.success) return;
        readCounts = {};
        data.reads.forEach(r => { readCounts[r.message_id] = r.read_count; });
        updateAllMessageTicks();
      } catch (err) { console.warn("fetchReadCounts error", err); }

chatWindow.addEventListener("click", (e) => {

  // 1️⃣ VOTE (button click)
  const voteBtn = e.target.closest(".poll-option");
  if (voteBtn) {
    const pollBox = voteBtn.closest(".poll-box");
    if (!pollBox) return;

    socket.emit("vote_poll", {
      poll_id: pollBox.dataset.poll,
      option_id: voteBtn.dataset.opt
    });
    return;
  }

  // 2️⃣ SHOW / HIDE VOTERS (arrow click)
  const caret = e.target.closest(".poll-caret");
  if (caret) {
    const pollBox = caret.closest(".poll-box");
    if (!pollBox) return;

    const voters = pollBox.querySelector(
      `.poll-voters[data-opt="${caret.dataset.opt}"]`
    );

    if (voters) {
      voters.classList.toggle("hidden");
    }
  }
});
